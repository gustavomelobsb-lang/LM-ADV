<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LM-ADV — Casos e Petições</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topo">
    <span class="marca">LM-ADV</span>
    <nav class="menu" id="menu-principal"></nav>
    <div>
      <span class="muted" id="usuario-logado"></span>
      <button class="secundario" id="btn-sair">Sair</button>
    </div>
  </header>
  <main>
    <h1>Casos e Petições</h1>

    <div class="card">
      <h2>Novo cliente</h2>
      <form id="form-cliente">
        <div class="grade-2">
          <div>
            <label for="c-nome">Nome</label>
            <input id="c-nome" required />
          </div>
          <div>
            <label for="c-tipo">Tipo</label>
            <select id="c-tipo">
              <option value="fisica">Pessoa física</option>
              <option value="juridica">Pessoa jurídica</option>
            </select>
          </div>
        </div>
        <div class="grade-2">
          <div>
            <label for="c-doc">CPF/CNPJ</label>
            <input id="c-doc" />
          </div>
          <div>
            <label for="c-endereco">Endereço</label>
            <input id="c-endereco" />
          </div>
        </div>
        <button type="submit">Salvar cliente</button>
        <div id="cliente-erro" class="erro"></div>
      </form>
    </div>

    <div class="card">
      <h2>Novo caso</h2>
      <form id="form-caso">
        <div class="grade-2">
          <div>
            <label for="caso-cliente">Cliente</label>
            <select id="caso-cliente" required></select>
          </div>
          <div>
            <label for="caso-tese">Tese jurídica aplicável</label>
            <select id="caso-tese"></select>
          </div>
        </div>
        <div class="grade-2">
          <div>
            <label for="caso-ramo">Ramo de justiça</label>
            <input id="caso-ramo" required placeholder="Ex.: Justiça do Trabalho, Justiça Estadual, Justiça Federal" />
          </div>
          <div>
            <label for="caso-tribunal">Tribunal (alias DataJud, opcional)</label>
            <input id="caso-tribunal" placeholder="Ex.: trt1, tjsp, trf3" />
          </div>
        </div>
        <label for="caso-comarca">Vara / Comarca</label>
        <input id="caso-comarca" placeholder="Ex.: 2ª Vara Cível da Comarca de São Paulo" />
        <label for="caso-fatos">Fatos do caso</label>
        <textarea id="caso-fatos" rows="5"></textarea>
        <label for="caso-pedidos">Pedidos específicos deste caso (um por linha)</label>
        <textarea id="caso-pedidos" rows="3"></textarea>
        <label for="caso-valor">Valor da causa (R$)</label>
        <input id="caso-valor" type="number" step="0.01" />
        <button type="submit">Criar caso</button>
        <div id="caso-erro" class="erro"></div>
      </form>
    </div>

    <div class="card">
      <h2>Casos</h2>
      <table>
        <thead><tr><th>Cliente</th><th>Tese</th><th>Ramo</th><th>Status</th><th></th></tr></thead>
        <tbody id="tabela-casos"></tbody>
      </table>
    </div>

    <div class="card" id="area-peticao" style="display:none;">
      <h2>Petição inicial gerada</h2>
      <pre class="peticao" id="texto-peticao"></pre>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script>
    exigirLogin();
    montarMenu("casos");

    let clientesCache = [];
    let tesesCache = [];

    async function carregarClientes() {
      const { clientes } = await apiFetch("/clientes");
      clientesCache = clientes;
      document.getElementById("caso-cliente").innerHTML = clientes
        .map((c) => `<option value="${c.id}">${c.nome}</option>`).join("");
    }

    async function carregarTesesSelect() {
      const { teses } = await apiFetch("/teses");
      tesesCache = teses;
      document.getElementById("caso-tese").innerHTML =
        `<option value="">(nenhuma)</option>` + teses.map((t) => `<option value="${t.id}">${t.titulo}</option>`).join("");
    }

    async function carregarCasos() {
      const { casos } = await apiFetch("/casos");
      document.getElementById("tabela-casos").innerHTML = casos
        .map(
          (c) => `<tr>
            <td>${c.cliente_nome}</td>
            <td>${c.tese_titulo || "—"}</td>
            <td>${c.ramo_justica}</td>
            <td><span class="pill">${c.status}</span></td>
            <td><button class="secundario" onclick="gerarPeticao(${c.id})">Gerar petição</button></td>
          </tr>`
        )
        .join("") || `<tr><td colspan="5" class="muted">Nenhum caso cadastrado ainda.</td></tr>`;
    }

    async function gerarPeticao(casoId) {
      const erroEl = document.getElementById("caso-erro");
      erroEl.textContent = "";
      try {
        const { conteudo } = await apiFetch(`/peticoes/gerar/${casoId}`, { method: "POST" });
        document.getElementById("area-peticao").style.display = "block";
        document.getElementById("texto-peticao").textContent = conteudo;
        document.getElementById("area-peticao").scrollIntoView({ behavior: "smooth" });
        carregarCasos();
      } catch (e) {
        erroEl.textContent = e.message;
      }
    }
    window.gerarPeticao = gerarPeticao;

    document.getElementById("form-cliente").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const erroEl = document.getElementById("cliente-erro");
      erroEl.textContent = "";
      try {
        await apiFetch("/clientes", {
          method: "POST",
          body: JSON.stringify({
            nome: document.getElementById("c-nome").value.trim(),
            tipo_pessoa: document.getElementById("c-tipo").value,
            cpf_cnpj: document.getElementById("c-doc").value.trim(),
            endereco: document.getElementById("c-endereco").value.trim(),
          }),
        });
        ev.target.reset();
        carregarClientes();
      } catch (e) {
        erroEl.textContent = e.message;
      }
    });

    document.getElementById("form-caso").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const erroEl = document.getElementById("caso-erro");
      erroEl.textContent = "";
      try {
        await apiFetch("/casos", {
          method: "POST",
          body: JSON.stringify({
            cliente_id: Number(document.getElementById("caso-cliente").value),
            tese_id: document.getElementById("caso-tese").value ? Number(document.getElementById("caso-tese").value) : null,
            ramo_justica: document.getElementById("caso-ramo").value.trim(),
            tribunal_alias: document.getElementById("caso-tribunal").value.trim(),
            comarca_vara: document.getElementById("caso-comarca").value.trim(),
            fatos: document.getElementById("caso-fatos").value.trim(),
            pedidos_especificos: document.getElementById("caso-pedidos").value.split("\n").map((s) => s.trim()).filter(Boolean),
            valor_causa: document.getElementById("caso-valor").value ? Number(document.getElementById("caso-valor").value) : null,
          }),
        });
        ev.target.reset();
        carregarCasos();
      } catch (e) {
        erroEl.textContent = e.message;
      }
    });

    (async () => {
      await Promise.all([carregarClientes(), carregarTesesSelect()]);
      carregarCasos();
    })();
  </script>
</body>
</html>
