name: Redefinir senha de colaborador

on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-mail do colaborador que tera a senha redefinida"
        required: true

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALVO_EMAIL: ${{ inputs.email }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Gerar nova senha e atualizar no D1
        run: |
          set -e
          NOVA_SENHA=$(openssl rand -base64 15)
          HASH=$(node -e "require('bcryptjs').hash(process.argv[1], 10).then(h => console.log(h))" "$NOVA_SENHA")
          ESC_EMAIL=$(printf '%s' "$ALVO_EMAIL" | tr '[:upper:]' '[:lower:]' | sed "s/'/''/g")
          npx wrangler d1 execute lm_adv_db --remote --command "UPDATE usuarios SET senha_hash = '$HASH' WHERE email = '$ESC_EMAIL'"
          echo ">>> NOVA_SENHA_PARA:$ALVO_EMAIL:$NOVA_SENHA <<<"
